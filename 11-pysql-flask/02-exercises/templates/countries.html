<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
</head>
<body>
    <div class="container-md">
        <h1> Countries in a region</h1>
            <form action="/countries" method="get" class="mb-4">
                <div class="mb-3">
                    <label for="region" class="form-label">Choose a region: </label>
                    <select name="region" id="region" class="form-select w-25">
                        <option value="">-- Velg en region --</option>
                        {% for region in regions_rows %}
                            <option value="{{ region[0] }}">{{ region[0] }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-primary mt-2">Send</button>
                </div>
            </form>
            <h2>Countries and their population in {{ region }}</h2>
            <div class="border rounded-3 overflow-auto mb-3">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Country</th>
                            <th>Population</th>
                        </tr>
                    </thead>
                    <tbody>
                     {% for name, population in countries %}
                        <tr>
                            <td>{{ name }}</td>
                            <td>{{ population }}</td>
                        </tr>
                     {% else %}
                        <tr>
                            <td>No countries found</td>
                        </tr>
                     {% endfor %}
                    </tbody>
                </table>
            </div>



            <a href="/">Home</a>
    </div>
</body>
</html>
